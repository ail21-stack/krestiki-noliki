<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Крестики-нолики</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#111827;color:#f4f7ff;font:16px Arial,sans-serif;display:flex;justify-content:center;align-items:center;padding:14px}
main{width:min(100%,520px);background:#1a263b;border:1px solid #35435d;border-radius:20px;padding:20px 14px;text-align:center;box-shadow:0 15px 45px #0005}
h1{font-size:26px;margin:2px 0 8px}.hint{color:#b8c5dc;font-size:14px;margin:0 0 16px}
.group{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:10px 0}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.choice,.action{border:0;border-radius:10px;background:#34435e;color:#fff;padding:11px 13px;font-size:14px;font-weight:bold}
.choice.selected{background:#4e7bf0}.status{min-height:26px;font-weight:bold;font-size:18px;margin:15px 0 12px}
.board{display:grid;gap:5px;width:min(90vw,430px);margin:auto;aspect-ratio:1}
.cell{appearance:none;-webkit-appearance:none;border:0;border-radius:8px;background:#2a3954;color:#fff;padding:0;margin:0;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:clamp(15px,8vw,54px);line-height:1;cursor:pointer}
.board[data-size="3"] .cell{font-size:clamp(38px,15vw,68px);border-radius:13px}
.board[data-size="5"] .cell{font-size:clamp(25px,9vw,45px)}
.cell.x{color:#69ddc8}.cell.o{color:#ffca75}.cell.win{background:#3b5b68}
.actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.action{background:#4e7bf0;padding:12px 16px;font-size:15px}.action.alt{background:#34435e}
.info{font-size:12px;color:#aab8d0;line-height:1.5;margin:13px 0 0}
</style>
</head>
<body>
<main>
<h1>Крестики-нолики</h1><p class="hint">Игра для телефона и компьютера</p>
<div class="group" aria-label="Режим игры">
<button type="button" class="choice selected" id="two">Вдвоём</button>
<button type="button" class="choice" id="cpu">Против компьютера</button>
</div>
<div class="group" aria-label="Размер поля">
<button type="button" class="choice selected" data-n="3">3 × 3</button>
<button type="button" class="choice" data-n="5">5 × 5</button>
<button type="button" class="choice" data-n="10">10 × 10</button>
</div>
<div class="status" id="status">Ход: X</div>
<div class="board" id="board" data-size="3"></div>
<div class="actions">
<button type="button" class="action" id="new">Новая игра</button>
<button type="button" class="action alt" id="scoreReset">Сбросить счёт</button>
</div>
<p class="info" id="rule">Для победы нужно собрать 3 символа подряд.</p>
<p class="info" id="score">Победы X: 0 · Победы O: 0 · Ничьи: 0</p>
</main>
<script>
(function(){
var size=3,need=3,mode='two',cells=[],values=[],turn='X',over=false,score={X:0,O:0,draw:0};
var board=document.getElementById('board'),status=document.getElementById('status'),scoreEl=document.getElementById('score');
function scores(){scoreEl.textContent='Победы X: '+score.X+' · Победы O: '+score.O+' · Ничьи: '+score.draw}
function setActive(){document.getElementById('two').classList.toggle('selected',mode==='two');document.getElementById('cpu').classList.toggle('selected',mode==='cpu');document.querySelectorAll('[data-n]').forEach(function(b){b.classList.toggle('selected',Number(b.getAttribute('data-n'))===size)})}
function newGame(){
 values=Array(size*size).fill('');turn='X';over=false;status.textContent='Ход: X';cells=[];
 board.innerHTML='';board.setAttribute('data-size',size);board.style.gridTemplateColumns='repeat('+size+',minmax(0,1fr))';
 for(var i=0;i<size*size;i++){
  var b=document.createElement('button');b.type='button';b.className='cell';b.setAttribute('aria-label','Клетка '+(i+1));
  (function(index,button){button.addEventListener('click',function(){move(index)});})(i,b);
  board.appendChild(b);cells.push(b);
 }
}
function getWin(i,mark){
 var row=Math.floor(i/size),col=i%size,dirs=[[0,1],[1,0],[1,1],[1,-1]];
 for(var d=0;d<dirs.length;d++){
  var run=[i],dr=dirs[d][0],dc=dirs[d][1];
  for(var sign=-1;sign<=1;sign+=2){
   var r=row+dr*sign,c=col+dc*sign;
   while(r>=0&&r<size&&c>=0&&c<size&&values[r*size+c]===mark){run.push(r*size+c);r+=dr*sign;c+=dc*sign}
  }
  if(run.length>=need)return run;
 }
 return null;
}
function put(i,mark){
 values[i]=mark;cells[i].textContent=mark;cells[i].classList.add(mark.toLowerCase());
 var win=getWin(i,mark);
 if(win){over=true;win.forEach(function(n){cells[n].classList.add('win')});status.textContent='Победили '+mark+'!';score[mark]++;scores();return true}
 if(values.every(Boolean)){over=true;status.textContent='Ничья!';score.draw++;scores();return true}
 return false;
}
function cpuMove(){
 var empty=[];for(var i=0;i<values.length;i++)if(!values[i])empty.push(i);
 if(!empty.length)return -1;
 // Сначала проверяем немедленную победу и блокировку на любом размере поля.
 for(var m=0;m<2;m++){
  var mark=m===0?'O':'X';
  for(var k=0;k<empty.length;k++){var at=empty[k];values[at]=mark;var win=getWin(at,mark);values[at]='';if(win)return at}
 }
 if(size===3&&!values[4])return 4;
 // Выбираем клетку рядом с уже поставленными символами, оценивая продолжение линий.
 var best=empty[0],bestScore=-Infinity;
 empty.forEach(function(at){
  var r=Math.floor(at/size),c=at%size,s=Math.random()*0.1;
  [[0,1],[1,0],[1,1],[1,-1]].forEach(function(dir){
   for(var sign=-1;sign<=1;sign+=2){
    for(var step=1;step<need;step++){
     var rr=r+dir[0]*sign*step,cc=c+dir[1]*sign*step;
     if(rr<0||rr>=size||cc<0||cc>=size)break;
     if(values[rr*size+cc]==='O')s+=2.5;
     if(values[rr*size+cc]==='X')s+=2;
    }
   }
  });
  if(s>bestScore){bestScore=s;best=at}
 });
 return best;
}
function move(i){
 if(over||values[i])return;
 if(mode==='cpu'&&turn==='O')return;
 if(put(i,turn))return;
 turn=turn==='X'?'O':'X';
 if(mode==='cpu'&&turn==='O'){
  status.textContent='Компьютер ходит…';
  var ai=cpuMove();
  if(ai>=0)put(ai,'O');
  if(!over){turn='X';status.textContent='Ваш ход: X'}
 }else status.textContent='Ход: '+turn;
}
document.getElementById('two').addEventListener('click',function(){mode='two';setActive();newGame()});
document.getElementById('cpu').addEventListener('click',function(){mode='cpu';setActive();newGame()});
document.querySelectorAll('[data-n]').forEach(function(b){b.addEventListener('click',function(){size=Number(b.getAttribute('data-n'));need=size===3?3:(size===5?4:5);document.getElementById('rule').textContent='Для победы нужно собрать '+need+' символа подряд.';setActive();newGame()})});
document.getElementById('new').addEventListener('click',newGame);
document.getElementById('scoreReset').addEventListener('click',function(){score={X:0,O:0,draw:0};scores();newGame()});
setActive();newGame();
})();
</script>
</body></html>
